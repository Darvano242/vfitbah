<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0f1115}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1280, H = +Q.get('h') || 800, SS = +Q.get('ss') || 2;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W * SS, H * SS);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color('#0d0f13');
scene.background = BG;
scene.fog = new THREE.Fog(BG, 6, 15);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

// ---------- lights: cool key, VFIT blue rim, soft fill ----------
const key = new THREE.SpotLight('#eef3ff', 46, 18, Math.PI / 5.5, 1.0, 1.6);
key.position.set(-2.6, 5.2, 3.2); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.radius = 6;
scene.add(key, key.target);
const rim = new THREE.SpotLight('#4296f0', 90, 16, Math.PI / 4, 0.7, 1.4);
rim.position.set(3.4, 2.2, -3.6); scene.add(rim, rim.target);
const rim2 = new THREE.SpotLight('#7bb6f4', 45, 14, Math.PI / 4, 0.8, 1.5);
rim2.position.set(-3.8, 1.6, -2.8); scene.add(rim2, rim2.target);
scene.add(new THREE.HemisphereLight('#9fb6d8', '#0a0b0e', 0.12));

// ---------- floor: dark rubber gym floor with soft sheen ----------
function floorTex() {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#16181c'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 26000; i++) { const v = 18 + Math.random() * 16; g.fillStyle = `rgb(${v},${v + 1},${v + 3})`; g.fillRect(Math.random() * 512, Math.random() * 512, 1.4, 1.4); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 10); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ map: floorTex(), roughness: 0.62, metalness: 0.0, color: '#3b3f47' }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// ---------- materials ----------
const chrome = new THREE.MeshStandardMaterial({ color: '#d9dde3', metalness: 1, roughness: 0.18 });
const steel = new THREE.MeshStandardMaterial({ color: '#b9bec6', metalness: 1, roughness: 0.34 });
function knurlTex() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256); g.strokeStyle = '#3a3a3a'; g.lineWidth = 2;
  for (let i = -256; i < 512; i += 10) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 256, 256); g.stroke(); g.beginPath(); g.moveTo(i + 256, 0); g.lineTo(i, 256); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 10); return t;
}
const knurl = new THREE.MeshStandardMaterial({ color: '#c3c8cf', metalness: 1, roughness: 0.42, roughnessMap: knurlTex(), bumpMap: knurlTex(), bumpScale: 1.2 });
const rubber = new THREE.MeshStandardMaterial({ color: '#121316', metalness: 0, roughness: 0.86 });
const blueRubber = new THREE.MeshStandardMaterial({ color: '#1a52a0', metalness: 0, roughness: 0.68 });
const lipMat = new THREE.MeshStandardMaterial({ color: '#2a2d33', metalness: 0.2, roughness: 0.5 });

// ---------- barbell (axis = X). Units: metres. ----------
const bar = new THREE.Group(); scene.add(bar);
function cyl(r, len, mat, seg = 64) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat); m.rotation.z = Math.PI / 2; m.castShadow = true; m.receiveShadow = true; return m; }
const shaft = new THREE.Group(); bar.add(shaft);
shaft.add(cyl(0.014, 1.31, chrome));
const kn = cyl(0.0142, 0.42, knurl); kn.position.x = -0.38; shaft.add(kn);
const kn2 = cyl(0.0142, 0.42, knurl); kn2.position.x = 0.38; shaft.add(kn2);
const sleeves = [];
for (const s of [-1, 1]) {
  const g = new THREE.Group();
  const coll = cyl(0.04, 0.03, chrome); coll.position.x = 0; g.add(coll);          // inner collar
  const sl = cyl(0.025, 0.415, chrome); sl.position.x = s * 0.2225; g.add(sl);      // sleeve
  const cap = cyl(0.027, 0.012, steel); cap.position.x = s * 0.436; g.add(cap);
  g.position.x = s * 0.67; bar.add(g); sleeves.push(g);
}

// plate: lathe profile => rubber body + raised lip + steel hub
function plate(dia, thick, colored) {
  const g = new THREE.Group(); const R = dia / 2, T = thick / 2;
  const pts = [
    [0.026, -T * 0.7], [0.07, -T * 0.7], [0.075, -T * 0.82], [R - 0.03, -T * 0.82], [R - 0.012, -T], [R, -T * 0.86],
    [R, T * 0.86], [R - 0.012, T], [R - 0.03, T * 0.82], [0.075, T * 0.82], [0.07, T * 0.7], [0.026, T * 0.7]
  ].map(p => new THREE.Vector2(p[0], p[1]));
  const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 96), colored ? blueRubber : rubber);
  body.rotation.z = Math.PI / 2; body.castShadow = body.receiveShadow = true; g.add(body);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, thick * 0.74, 64, 1, true), steel);
  hub.rotation.z = Math.PI / 2; g.add(hub);
  for (const s of [-1, 1]) {
    const face = new THREE.Mesh(new THREE.RingGeometry(0.0255, 0.06, 64), steel);
    face.rotation.y = s * Math.PI / 2; face.position.x = s * thick * 0.37; g.add(face);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(R - 0.05, 0.004, 12, 120), lipMat);
    ring.rotation.y = Math.PI / 2; ring.position.x = s * T * 0.84; g.add(ring);
  }
  return g;
}
function clamp(sign) {
  const g = new THREE.Group();
  const c = cyl(0.04, 0.05, steel); g.add(c);
  const lever = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.07, 0.016), chrome); lever.position.set(0, 0.06, 0.0); lever.castShadow = true; g.add(lever);
  return g;
}

// load per side (inner to outer): 20 (blue), 15, 10, then the added 5
const SPEC = [
  { d: 0.45, t: 0.062, blue: true }, { d: 0.45, t: 0.05, blue: false }, { d: 0.45, t: 0.04, blue: false }, { d: 0.32, t: 0.03, blue: false, added: true }
];
const plates = []; // {mesh, side, home, isAdded}
for (const s of [-1, 1]) {
  let x = 0.67 + 0.015; // start just outside the inner collar
  for (const p of SPEC) {
    const m = plate(p.d, p.t, p.blue); x += p.t / 2; const home = s * (x + 0.0015); x += p.t / 2 + 0.003;
    m.position.x = home; bar.add(m); plates.push({ m, s, home, spec: p });
  }
  const cl = clamp(s); const ch = s * (x + 0.026); cl.position.x = ch; bar.add(cl); plates.push({ m: cl, s, home: ch, clamp: true });
}

// ---------- contact shadows (soft blobs under each end) ----------
function blobTex() { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const r = g.createRadialGradient(64, 64, 4, 64, 64, 64); r.addColorStop(0, 'rgba(0,0,0,0.85)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); }
const blobs = [];
for (const s of [-1, 1]) { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.62), new THREE.MeshBasicMaterial({ map: blobTex(), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(s * 0.78, 0.002, 0); scene.add(m); blobs.push(m); }

// ---------- timeline ----------
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const sm = (a, b, t) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return ease(x); };
const lerp = (a, b, t) => a + (b - a) * t;
const aspect = W / H; const portrait = aspect < 1;
const cam = new THREE.PerspectiveCamera(portrait ? 40 : 30, aspect, 0.05, 40);

// clamp position for an "assembled" bar (without / with added plate)
function clampHome(s, withAdded) {
  let x = 0.67 + 0.015;
  for (const p of SPEC) { if (p.added && !withAdded) continue; x += p.t + 0.003; }
  return s * (x + 0.026 - 0.003 / 2);
}

window.renderFrame = function (t) {
  // phases
  const lift = sm(0.14, 0.4, t) * (1 - sm(0.8, 0.96, t));
  const spread = sm(0.18, 0.5, t) * (1 - sm(0.72, 0.9, t));
  const spin = sm(0.1, 0.55, t);

  bar.position.y = 0.225 + lift * 0.42;
  bar.rotation.y = lerp(0, -0.22, spin) + lerp(0, 0.22, sm(0.7, 1, t));
  bar.rotation.z = Math.sin(t * Math.PI) * 0.035;

  const addIn = sm(0.46, 0.68, t);
  const baseSwap = sm(0.5, 0.7, t);
  for (const p of plates) {
    if (p.clamp) {
      const home = lerp(clampHome(p.s, false), clampHome(p.s, true), baseSwap);
      p.m.position.x = home + p.s * 0.95 * spread;
      p.m.rotation.x = spread * p.s * 1.4;
    } else {
      const k = SPEC.indexOf(p.spec);
      const gap = 0.1 + 0.17 * (k + 1);
      p.m.position.x = p.home + p.s * gap * spread;
      p.m.rotation.x = spread * p.s * (0.3 + k * 0.22);
      p.m.position.y = Math.sin(spread * Math.PI) * 0.01 * (k + 1);
      if (p.spec.added) {
        p.m.visible = t > 0.44;
        p.m.position.x += p.s * 2.4 * (1 - addIn);
        p.m.position.y += (1 - addIn) * 0.55;
        p.m.rotation.x += (1 - addIn) * p.s * 4.0;
      } else if (!p.spec.added && k < 3) {
        // plates outside the slot for the added plate sit at their pre-add home until the swap
      }
    }
  }
  const near = 1 - Math.min(1, (bar.position.y - 0.225) / 0.3);
  blobs.forEach((b, i) => { b.material.opacity = 0.25 + 0.75 * near; b.scale.setScalar(1 + (1 - near) * 0.6); b.position.x = (i ? 1 : -1) * 0.78 * Math.cos(bar.rotation.y); b.position.z = (i ? -1 : 1) * 0.78 * Math.sin(bar.rotation.y); });

  // camera path: low close detail -> elevated 3/4 over the exploded load -> low hero 3/4
  const up = sm(0.06, 0.48, t), down = sm(0.7, 1, t);
  const a = lerp(lerp(1.2, 0.6, up), 0.82, down);
  const dist = (portrait ? 1.3 * Math.pow(0.8 / aspect, 0.8) : 1) * lerp(lerp(2.3, 3.7, up), 3.0, down);
  const hgt = lerp(lerp(0.3, 1.45, up), 0.42, down);
  cam.position.set(Math.sin(a) * dist, hgt + bar.position.y * 0.4, Math.cos(a) * dist);
  const look = new THREE.Vector3(lerp(lerp(0.45, 0.05, up), 0.1, down), bar.position.y * 0.8 + 0.02, 0);
  cam.lookAt(look);
  key.target.position.set(0, 0.3, 0); rim.target.position.set(0, 0.4, 0); rim2.target.position.set(0, 0.4, 0);
  renderer.render(scene, cam);
};

// downscale supersampled frame into the output size, return webp data URL
const out = document.createElement('canvas'); out.width = W; out.height = H; const og = out.getContext('2d');
og.imageSmoothingQuality = 'high';
window.grab = function (t, q) {
  window.renderFrame(t);
  og.drawImage(renderer.domElement, 0, 0, W, H);
  // vignette
  const v = og.createRadialGradient(W * 0.5, H * 0.52, Math.min(W, H) * 0.25, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(13,15,19,0)'); v.addColorStop(1, 'rgba(13,15,19,0.65)'); og.fillStyle = v; og.fillRect(0, 0, W, H);
  return out.toDataURL('image/webp', q || 0.72);
};
window.ready = true;
</script></body></html>
