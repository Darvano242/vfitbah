name: VFitness Production QA

on:
  push:
    branches:
      - main
      - 'qa/**'
      - 'feature/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vfitness-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build modular production and run release gates
        run: node scripts/build-production.js

      - name: Run browser and route smoke tests
        env:
          CI: 'true'
          VF_BASE_URL: http://127.0.0.1:4173
        run: |
          mkdir -p /tmp/vfitness-playwright
          cd /tmp/vfitness-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

          PORT=4173 node "$GITHUB_WORKSPACE/tests/static-server.js" "$GITHUB_WORKSPACE/site" >/tmp/vfitness-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          cp "$GITHUB_WORKSPACE/tests/smoke.spec.js" ./smoke.spec.js
          npx playwright test smoke.spec.js --reporter=line --workers=1
