name: VFitness Production QA

on:
  push:
    branches:
      - main
      - 'qa/**'
      - 'feature/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: vfitness-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and run static release gates
        run: node scripts/build-production.js

      - name: Capture modular source architecture
        if: ${{ github.ref == 'refs/heads/refactor/source-architecture-20260730' || github.head_ref == 'refactor/source-architecture-20260730' }}
        run: |
          node scripts/capture-modular-source.js
          node scripts/verify-captured-source.js

      - name: Run browser and route smoke tests
        env:
          CI: 'true'
          VF_BASE_URL: http://127.0.0.1:4173
        run: |
          mkdir -p /tmp/vfitness-playwright
          cd /tmp/vfitness-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

          PORT=4173 node "$GITHUB_WORKSPACE/tests/static-server.js" "$GITHUB_WORKSPACE/site" >/tmp/vfitness-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          cp "$GITHUB_WORKSPACE/tests/smoke.spec.js" ./smoke.spec.js
          npx playwright test smoke.spec.js --reporter=line --workers=1

      - name: Commit verified modular source
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/refactor/source-architecture-20260730' && !contains(github.event.head_commit.message, '[capture-complete]') }}
        run: |
          git config user.name "vfitness-release-bot"
          git config user.email "vfitness-release-bot@users.noreply.github.com"
          git add src/app
          if git diff --cached --quiet; then
            echo "No source capture changes"
            exit 0
          fi
          git commit -m "Capture verified modular app source [capture-complete]"
          git push origin HEAD:refactor/source-architecture-20260730
